image: maven:3.9.5-openjdk-21

stages:
  - build
  - test

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  paths:
    - .m2/repository/

build:
  stage: build
  script:
    - mvn clean package -B
  artifacts:
    paths:
      - target/*.jar

test:
  stage: test
  script:
    - mvn test -B
  dependencies:
    - build